<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>記憶配對遊戲 - /ts/ 之音練習</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            touch-action: manipulation; /* Prevent double-tap zoom on mobile */
        }

        /* 3D Card Flipping Styles */
        .perspective-1000 {
            perspective: 1000px;
        }
        
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid transparent;
        }
        
        /* The front of the card (shows emoji initially) */
        .card-front {
            background-color: #fef08a; /* Yellow-200 */
            border-color: #fde047;
            font-size: 3rem;
            cursor: pointer;
        }
        
        .card-front:hover {
            transform: scale(1.02);
            transition: transform 0.2s;
        }
        
        /* The back of the card (shows the word when flipped) */
        .card-back {
            background-color: #ffffff;
            border-color: #60a5fa; /* Blue-400 */
            transform: rotateY(180deg);
            padding: 0.5rem;
        }

        .card.matched .card-back {
            background-color: #dcfce7; /* Green-100 */
            border-color: #4ade80; /* Green-400 */
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.5);
            animation: pulse-match 2s infinite;
        }

        @keyframes pulse-match {
            0%, 100% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.05); }
        }

        /* Celebration Animations */
        @keyframes float-up {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .emoji-particle {
            position: fixed;
            font-size: 2rem;
            z-index: 50;
            pointer-events: none;
            animation: float-up 3s ease-out forwards;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #93c5fd; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8 overflow-x-hidden overflow-y-auto text-slate-800">

    <!-- 1. Start Screen -->
    <div id="start-screen" class="w-full max-w-2xl my-auto bg-white/90 backdrop-blur-sm rounded-3xl p-8 shadow-2xl text-center transform transition-all duration-500 scale-100">
        <div class="text-6xl mb-4">🗣️🧩</div>
        <h1 class="text-4xl md:text-5xl font-black text-blue-600 mb-6 tracking-wide">發音小達人<br><span class="text-2xl text-blue-400">記憶配對遊戲</span></h1>
        
        <div class="bg-blue-50 rounded-2xl p-6 mb-8 text-left space-y-3 shadow-inner">
            <h2 class="text-xl font-bold text-blue-800 border-b-2 border-blue-200 pb-2">📋 遊戲玩法與規則：</h2>
            <ul class="list-disc list-inside text-lg text-slate-700 space-y-2">
                <li>翻開兩張卡片，找出<strong>相同文字</strong>的配對。</li>
                <li>每次成功配對後，請<strong>大聲、清晰地讀出</strong>卡片上的詞語！</li>
                <li>遊戲共有 <strong>10 個回合</strong>。</li>
                <li>每個回合有 <strong>60 秒</strong> 時間限制，配對時會暫停計時！</li>
            </ul>
        </div>

        <button id="start-btn" class="w-full md:w-auto px-12 py-4 bg-gradient-to-r from-green-400 to-blue-500 hover:from-green-500 hover:to-blue-600 text-white font-bold rounded-full text-2xl shadow-lg transform transition hover:scale-105 active:scale-95">
            開始遊戲 🚀
        </button>
    </div>

    <!-- 2. Game Screen -->
    <div id="game-screen" class="w-full max-w-4xl hidden flex-col my-auto py-4">
        
        <!-- Header: Stats -->
        <div class="bg-white/90 backdrop-blur-sm rounded-2xl p-4 shadow-md flex justify-between items-center mb-4 shrink-0">
            <div class="text-center">
                <p class="text-sm font-bold text-slate-500 uppercase tracking-wider">回合</p>
                <p class="text-2xl font-black text-blue-600"><span id="round-display">1</span> / 10</p>
            </div>
            <div class="text-center">
                <p class="text-sm font-bold text-slate-500 uppercase tracking-wider">時間</p>
                <p id="timer-display" class="text-3xl font-black text-rose-500 w-20">01:30</p>
            </div>
            <div class="text-center">
                <p class="text-sm font-bold text-slate-500 uppercase tracking-wider">分數</p>
                <p id="score-display" class="text-2xl font-black text-amber-500">0</p>
            </div>
        </div>

        <!-- Feedback Banner -->
        <div id="feedback-banner" class="min-h-[5rem] flex items-center justify-center mb-4 shrink-0 transition-opacity duration-300 opacity-0 pointer-events-none z-10">
            <div id="feedback-container" class="flex flex-col md:flex-row items-center gap-4 px-6 py-3 rounded-2xl shadow-lg transform transition-transform scale-110 bg-white pointer-events-auto">
                <div id="feedback-text" class="text-xl md:text-2xl font-black text-center">準備開始！</div>
                <button id="resume-btn" class="hidden px-8 py-2 rounded-full font-bold text-xl shadow-md hover:scale-105 transition-transform active:scale-95">
                    繼續 ➡️
                </button>
            </div>
        </div>

        <!-- Grid -->
        <div class="flex-1 flex items-center justify-center min-h-[400px]">
            <div id="card-grid" class="grid grid-cols-4 gap-2 md:gap-4 w-full max-w-2xl aspect-square md:aspect-auto md:h-[60vh]">
                <!-- Cards will be generated here -->
            </div>
        </div>
    </div>

    <!-- 3. Round Summary / Transition Overlay -->
    <div id="round-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 hidden flex items-center justify-center">
        <div class="bg-white rounded-3xl p-8 max-w-md w-11/12 text-center shadow-2xl transform transition-transform duration-300 scale-90 max-h-[90vh] overflow-y-auto" id="round-modal">
            <div class="text-6xl mb-4" id="round-icon">🎉</div>
            <h2 class="text-3xl font-black mb-2" id="round-title">回合完成！</h2>
            <p class="text-xl text-slate-600 mb-6" id="round-msg">做得好！</p>
            <button id="next-round-btn" class="px-8 py-3 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-full text-xl shadow-md transition transform hover:scale-105 active:scale-95">
                下一回合 ➡️
            </button>
        </div>
    </div>

    <!-- 4. Final Celebration Screen -->
    <div id="end-screen" class="w-full max-w-2xl my-auto bg-white/95 backdrop-blur-md rounded-3xl p-8 shadow-2xl text-center hidden relative overflow-hidden z-50">
        <div class="text-7xl mb-6">🏆</div>
        <h1 class="text-4xl md:text-5xl font-black text-rose-500 mb-4">大成功！</h1>
        <p class="text-2xl text-slate-700 mb-2">你已經完成了所有 10 個回合的挑戰！</p>
        <p class="text-xl text-slate-500 mb-8">你的發音練習做得非常棒！</p>
        
        <div class="bg-amber-100 rounded-2xl p-6 mb-8 inline-block shadow-inner">
            <p class="text-lg font-bold text-amber-800 mb-1">總得分</p>
            <p id="final-score" class="text-6xl font-black text-amber-500">0</p>
        </div>

        <div>
            <button id="restart-btn" class="px-10 py-4 bg-gradient-to-r from-rose-400 to-orange-500 hover:from-rose-500 hover:to-orange-600 text-white font-bold rounded-full text-2xl shadow-lg transform transition hover:scale-105 active:scale-95">
                再玩一次 🔄
            </button>
        </div>
    </div>

    <script>
        /** --- Game Data & Configuration --- */
        const THERAPY_WORDS = [
            "觸礁", "展覽廳", "走斜波", "宗教堂", "新照片", "仙人掌", 
            "最優秀", "紫薯批", "炸雞膇", "直播主", "芝麻油", "這週末", 
            "星期六", "星期日", "孜然粉", "佳之選", "支付寶", "豬腳薑", 
            "置富道", "食竹葉", "香港仔", "冷知識", "三文治", "山楂餅", 
            "手指公", "織冷衫", "幾張紙", "珍珠鏈", "毒蜘蛛", "豬油渣", 
            "鑽石山站", "營養價值", "重新振作", "端午粽子", "小息追逐", 
            "小組討論", "胡椒種子", "種植植物"
        ];

        const EMOJIS = ["🤪", "🤓", "🤠", "👾", "👻", "🤖", "🎃", "👽", "🦊", "🐸", "🐵", "🐧", "🦁", "🐰", "🦄", "🦖"];

        const TOTAL_ROUNDS = 10;
        const TIME_LIMIT_SEC = 60;
        const PAIRS_PER_ROUND = 8; // 4x4 grid = 16 cards = 8 pairs

        /** --- Game State --- */
        let currentRound = 1;
        let score = 0;
        let timeLeft = TIME_LIMIT_SEC;
        let timerInterval;
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let isBoardLocked = false;
        let isTimerPaused = false;
        let pendingMatchResult = null; // 新增狀態：記錄等待「繼續」按鈕時的配對結果
        
        /** --- Audio Context Synthesis (No external assets needed) --- */
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(frequency, type, duration, volume = 0.1) {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        const sounds = {
            flip: () => playTone(300, 'sine', 0.1, 0.05),
            match: () => {
                playTone(440, 'sine', 0.1, 0.1);
                setTimeout(() => playTone(554, 'sine', 0.1, 0.1), 100);
                setTimeout(() => playTone(659, 'sine', 0.3, 0.1), 200);
            },
            mismatch: () => {
                playTone(200, 'sawtooth', 0.2, 0.05);
                setTimeout(() => playTone(150, 'sawtooth', 0.3, 0.05), 150);
            },
            roundWin: () => {
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    setTimeout(() => playTone(freq, 'square', i === 3 ? 0.4 : 0.1, 0.05), i * 150);
                });
            },
            timeout: () => {
                playTone(300, 'triangle', 0.5, 0.1);
                setTimeout(() => playTone(250, 'triangle', 0.8, 0.1), 400);
            }
        };

        /** --- Utility Functions --- */
        function shuffleArray(array) {
            const newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function createEmojiParticles(count = 30) {
            for(let i=0; i<count; i++) {
                const particle = document.createElement('div');
                particle.classList.add('emoji-particle');
                particle.innerText = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.animationDuration = `${2 + Math.random() * 2}s`;
                particle.style.animationDelay = `${Math.random() * 0.5}s`;
                document.body.appendChild(particle);
                
                setTimeout(() => particle.remove(), 4000);
            }
        }

        /** --- UI Updaters --- */
        function showFeedback(text, type, showResume = false) {
            const banner = document.getElementById('feedback-banner');
            const container = document.getElementById('feedback-container');
            const textEl = document.getElementById('feedback-text');
            const resumeBtn = document.getElementById('resume-btn');

            textEl.innerHTML = text;
            
            // 基礎樣式
            container.className = 'flex flex-col md:flex-row items-center gap-4 px-6 py-3 rounded-2xl shadow-lg transform transition-transform scale-110 pointer-events-auto ';
            
            if (type === 'success') {
                container.classList.add('bg-green-500', 'text-white');
                resumeBtn.className = 'px-8 py-2 bg-white text-green-600 rounded-full font-bold text-xl shadow-md hover:bg-green-50 hover:scale-105 transition-transform active:scale-95';
            } else if (type === 'error') {
                container.classList.add('bg-red-400', 'text-white');
                resumeBtn.className = 'px-8 py-2 bg-white text-red-500 rounded-full font-bold text-xl shadow-md hover:bg-red-50 hover:scale-105 transition-transform active:scale-95';
            } else {
                container.classList.add('bg-blue-500', 'text-white');
            }

            if (showResume) {
                resumeBtn.classList.remove('hidden');
            } else {
                resumeBtn.classList.add('hidden');
            }

            banner.style.opacity = '1';
            banner.classList.remove('pointer-events-none');
        }

        function hideFeedback() {
            const banner = document.getElementById('feedback-banner');
            banner.style.opacity = '0';
            banner.classList.add('pointer-events-none');
        }

        /** --- Game Core Logic --- */
        function initGame() {
            initAudio();
            currentRound = 1;
            score = 0;
            document.getElementById('score-display').innerText = score;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            startRound();
        }

        function startRound() {
            // Reset variables
            matchedPairs = 0;
            flippedCards = [];
            isBoardLocked = false;
            isTimerPaused = false;
            timeLeft = TIME_LIMIT_SEC;
            
            document.getElementById('round-display').innerText = currentRound;
            document.getElementById('timer-display').innerText = formatTime(timeLeft);
            document.getElementById('timer-display').className = 'text-3xl font-black text-rose-500 w-20';
            hideFeedback();

            // Select words for this round
            const shuffledWords = shuffleArray(THERAPY_WORDS);
            const selectedWords = shuffledWords.slice(0, PAIRS_PER_ROUND);
            
            // Create pairs
            cards = [...selectedWords, ...selectedWords];
            cards = shuffleArray(cards);

            renderGrid();
            startTimer();
        }

        function renderGrid() {
            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';
            
            cards.forEach((word, index) => {
                // Select a random emoji for the card back
                const randomEmoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
                
                // Determine font size based on word length
                let wordFontSize = 'text-2xl md:text-3xl';
                if(word.length > 4) wordFontSize = 'text-lg md:text-xl leading-tight';
                else if(word.length > 3) wordFontSize = 'text-xl md:text-2xl';

                const cardEl = document.createElement('div');
                cardEl.className = 'card perspective-1000 w-full h-full cursor-pointer';
                cardEl.dataset.word = word;
                cardEl.dataset.index = index;
                
                cardEl.innerHTML = `
                    <div class="card-inner shadow-sm rounded-2xl">
                        <div class="card-front">
                            ${randomEmoji}
                        </div>
                        <div class="card-back flex items-center justify-center">
                            <span class="font-bold text-slate-800 ${wordFontSize}">${word}</span>
                        </div>
                    </div>
                `;
                
                cardEl.addEventListener('click', () => handleCardClick(cardEl));
                grid.appendChild(cardEl);
            });
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isTimerPaused) return;

                timeLeft--;
                document.getElementById('timer-display').innerText = formatTime(timeLeft);
                
                if (timeLeft <= 10) {
                    document.getElementById('timer-display').classList.add('animate-pulse');
                } else {
                    document.getElementById('timer-display').classList.remove('animate-pulse');
                }
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleRoundEnd(false); // Time up
                }
            }, 1000);
        }

        function handleCardClick(cardEl) {
            if (isBoardLocked) return;
            if (cardEl.classList.contains('flipped')) return;

            sounds.flip();
            cardEl.classList.add('flipped');
            flippedCards.push(cardEl);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            isBoardLocked = true;
            isTimerPaused = true;
            const [card1, card2] = flippedCards;
            const match = card1.dataset.word === card2.dataset.word;

            if (match) {
                // MATCHED
                sounds.match();
                matchedPairs++;
                
                // Score calculation: Base 10 + time bonus
                const points = 10 + Math.floor(timeLeft / 10);
                score += points;
                document.getElementById('score-display').innerText = score;

                card1.classList.add('matched');
                card2.classList.add('matched');
                
                // THERAPEUTIC GOAL: Encourage pronunciation
                pendingMatchResult = 'match';
                showFeedback(`⭐ 答對了！請讀出：<br><span class="text-3xl">「${card1.dataset.word}」</span>`, 'success', true);

            } else {
                // NOT MATCHED
                sounds.mismatch();
                pendingMatchResult = 'mismatch';
                showFeedback('再試一次！', 'error', true);
            }
        }

        function resumeGame() {
            if (!isBoardLocked) return;

            hideFeedback();

            if (pendingMatchResult === 'match') {
                if (matchedPairs === PAIRS_PER_ROUND) {
                    clearInterval(timerInterval);
                    handleRoundEnd(true);
                } else {
                    flippedCards = [];
                    isBoardLocked = false;
                    isTimerPaused = false;
                }
            } else if (pendingMatchResult === 'mismatch') {
                const [card1, card2] = flippedCards;
                card1.classList.remove('flipped');
                card2.classList.remove('flipped');
                flippedCards = [];
                isBoardLocked = false;
                isTimerPaused = false;
            }
            
            pendingMatchResult = null;
        }

        function handleRoundEnd(isSuccess) {
            const overlay = document.getElementById('round-overlay');
            const modal = document.getElementById('round-modal');
            const icon = document.getElementById('round-icon');
            const title = document.getElementById('round-title');
            const msg = document.getElementById('round-msg');
            const btn = document.getElementById('next-round-btn');

            overlay.classList.remove('hidden');
            
            // Trigger animation
            setTimeout(() => modal.classList.remove('scale-90'), 50);

            if (isSuccess) {
                sounds.roundWin();
                icon.innerText = "🌟";
                title.innerText = "回合完成！";
                title.className = "text-3xl font-black mb-2 text-green-500";
                msg.innerText = `太棒了！你獲得了 ${score} 分。`;
                createEmojiParticles(15);
            } else {
                sounds.timeout();
                icon.innerText = "⏰";
                title.innerText = "時間到了！";
                title.className = "text-3xl font-black mb-2 text-orange-500";
                msg.innerText = "沒關係，我們準備進入下一回合！";
            }

            if (currentRound >= TOTAL_ROUNDS) {
                btn.innerText = "查看總成績 🏆";
                btn.onclick = () => {
                    closeModal();
                    showEndScreen();
                };
            } else {
                btn.innerText = "下一回合 ➡️";
                btn.onclick = () => {
                    currentRound++;
                    closeModal();
                    startRound();
                };
            }
        }

        function closeModal() {
            const overlay = document.getElementById('round-overlay');
            const modal = document.getElementById('round-modal');
            modal.classList.add('scale-90');
            setTimeout(() => overlay.classList.add('hidden'), 300);
        }

        function showEndScreen() {
            document.getElementById('game-screen').classList.add('hidden');
            const endScreen = document.getElementById('end-screen');
            endScreen.classList.remove('hidden');
            document.getElementById('final-score').innerText = score;
            
            sounds.roundWin();
            setTimeout(createEmojiParticles, 500);
            setTimeout(() => createEmojiParticles(50), 1500);
        }

        /** --- Event Listeners --- */
        document.getElementById('start-btn').addEventListener('click', initGame);
        document.getElementById('restart-btn').addEventListener('click', () => {
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        });
        document.getElementById('resume-btn').addEventListener('click', resumeGame); // 新增按鈕監聽器

    </script>
</body>
</html>
